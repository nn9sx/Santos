[project]
name = "santos"
version = "0.0.0"
description = "pitch-flap loads a local README corpus and pitches from it"
requires-python = ">=3.11"
dependencies = ["python-dotenv", "sqlalchemy>=2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pitch-flap = "santos:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
